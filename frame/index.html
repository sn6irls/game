<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff1f7"><title>훈녀생정 프레임 · SNgirls</title><link rel="stylesheet" href="style.css?v=2"></head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 6h4l2-3h4l2 3h4a2 2 0 0 1 2 2v11H2V8a2 2 0 0 1 2-2Z"/><circle cx="12" cy="12" r="4"/></symbol>
<symbol id="i-flip" viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 14-3l3 3M21 3v6h-6M20 15A8 8 0 0 1 6 18l-3-3M3 21v-6h6"/></symbol>
<symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 15v6h16v-6"/></symbol>
<symbol id="i-color" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20c4 0 1-5 4-5h2c6 0 5-15-6-15Z"/><circle cx="7" cy="9" r="1"/><circle cx="12" cy="6" r="1"/><circle cx="17" cy="9" r="1"/><circle cx="6" cy="14" r="1"/></symbol>
<symbol id="i-gif" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="4"/><path d="M9 9H5v6h4v-3H7m5-3v6m3 0V9h4m-4 3h3"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
</defs></svg>
<main><section class="stage" aria-label="훈녀생정 프레임 카메라">
<canvas id="view" width="540" height="960"></canvas><span id="timer" hidden>● 00:00</span>
<div id="welcome"><button id="start" aria-label="카메라 켜기" title="카메라 켜기"><svg><use href="#i-camera"/></svg></button></div>
<p id="status" role="status" aria-live="polite"></p>
<nav aria-label="카메라 도구">
<button id="flip" disabled aria-label="전면 / 후면 카메라" title="전면 / 후면"><svg><use href="#i-flip"/></svg></button>
<button id="shutter" disabled aria-label="사진 촬영, 길게 누르면 녹화" title="사진 촬영, 길게 누르면 녹화"><span></span></button>
<button id="color" disabled aria-label="색 변경 · 핑크" title="색 변경"><svg><use href="#i-color"/></svg></button>
<button id="download" disabled aria-label="촬영 결과 다운로드" title="다운로드"><svg><use href="#i-save"/></svg></button>
</nav></section></main>
<dialog id="result" aria-label="촬영 결과"><button id="close" aria-label="닫기"><svg><use href="#i-close"/></svg></button><img id="photo" alt="프레임 촬영 결과" hidden><video id="clip" controls playsinline loop hidden></video><div class="save-buttons"><button id="save" aria-label="사진 저장" title="저장"><svg><use href="#i-save"/></svg></button><button id="gif" hidden disabled aria-label="GIF 저장" title="GIF 저장"><svg><use href="#i-gif"/></svg></button></div><p id="save-note" class="sr-only"></p></dialog>
<video id="camera" muted playsinline autoplay class="source"></video><video id="frame" src="frame1.mp4" muted playsinline loop preload="auto" class="source"></video>
<script type="module" src="app.js?v=2"></script></body></html>
