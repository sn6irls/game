<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>SUPERNORMALGIRLS Playlist</title><style>html,body,#player{width:100%;height:100%;margin:0;background:#111;overflow:hidden}iframe{border:0}#loading{position:absolute;inset:0;display:grid;place-items:center;color:#ddd;font:14px sans-serif;pointer-events:none}</style></head><body><div id="player"></div><div id="loading">플레이리스트 불러오는 중…</div><script>
(()=>{
 const params=new URLSearchParams(location.search),list=params.get('list')||'',volume=Math.max(0,Math.min(30,Number(params.get('volume'))||12));
 let player,ready=false,ticker=0,skipped=0;
 const send=(event,info)=>parent.postMessage({channel:'sng-computer-player',event,info},'*');
 function publish(){if(!ready)return;const video=player.getVideoData();send('infoDelivery',{playerState:player.getPlayerState(),currentTime:player.getCurrentTime(),duration:player.getDuration(),muted:player.isMuted(),volume:player.getVolume(),videoData:{title:video.title||'',author:video.author||''}});}
 if(!/^[A-Za-z0-9_-]{2,100}$/.test(list)){send('onError',2);document.getElementById('loading').textContent='플레이리스트를 확인해주세요.';return;}
 window.onYouTubeIframeAPIReady=()=>{
  player=new YT.Player('player',{width:'100%',height:'100%',host:'https://www.youtube-nocookie.com',playerVars:{listType:'playlist',list,autoplay:0,playsinline:1,rel:0,origin:location.origin},events:{
   onReady(){ready=true;document.getElementById('loading').remove();player.setVolume(volume);player.setLoop(true);if(params.get('muted')==='1')player.mute();send('onReady');publish();player.playVideo();ticker=setInterval(publish,700);},
   onStateChange(event){publish();if(event.data===1)skipped=0;},
   onAutoplayBlocked(){send('onAutoplayBlocked');},
   onError(event){if([100,101,150].includes(event.data)&&++skipped<Math.min(player.getPlaylist()?.length||1,10)){player.nextVideo();return;}send('onError',event.data);}
  }});
 };
 addEventListener('message',event=>{
  if(event.source!==parent||!ready||event.data?.channel!=='sng-computer-command')return;
  const {func,args=[]}=event.data;
  if(func==='playVideo'){player.setVolume(volume);player.playVideo();}
  else if(func==='pauseVideo')player.pauseVideo();else if(func==='previousVideo')player.previousVideo();else if(func==='nextVideo')player.nextVideo();
  else if(func==='mute')player.mute();else if(func==='unMute'){player.setVolume(volume);player.unMute();}
  else if(func==='seekTo'&&Number.isFinite(Number(args[0])))player.seekTo(Math.max(0,Number(args[0])),true);
  publish();
 });
 addEventListener('pagehide',()=>{clearInterval(ticker);player?.destroy?.();});
 const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.onerror=()=>send('onError','network');document.head.append(script);
})();
</script></body></html>
